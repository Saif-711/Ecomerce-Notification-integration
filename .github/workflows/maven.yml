name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: "22"
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            Notification-System/notification-service/pom.xml
            e-commerce-platform/pom.xml

      - name: Build notification service
        run: mvn -B verify --file Notification-System/notification-service/pom.xml

      - name: Build e-commerce platform
        run: mvn -B verify --file e-commerce-platform/pom.xml
